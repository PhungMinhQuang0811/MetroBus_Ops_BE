springdoc:
  swagger-ui:
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

app:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    public-endpoints: >
      "/auth/login",
      "/auth/refresh-token",
      "/auth/forgot-password",
      "/v3/api-docs/**",
      "/swagger-ui/**",
      "/swagger-ui.html",
      "/actuator/**"
